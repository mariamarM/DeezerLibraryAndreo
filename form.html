<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="cabecera">
        <div class="flechaIzq"> <a href="index.html"><img src="./img/izquierdaFLECHA.png"></a></div>
        <nav class="menu">
            <p class="menuTxt">intro</p>
            <p class="menuTxt">form</p>
            <p class="menuTxt">registers</p>

        </nav>
        <div class="flechaDerecha"> <a href="registers.html"><img src="./img/izquierdaFLECHA.png"></a></div>
    </div>
    <form id="formBusqueda" class="form">
        <p class="inputText">Search or register a new <br>band/artist</p>
        <input type="text"  id="nombreBandaFormulario" placeholder="Band or artist" >
        <input type="submit" id="searchBtn" value="Search" name="searchSong" >
        <div class="genero" >
            <p class="inputText">Your registers</p>
            <div class="generoInput">
                <input type="text" name="campoArtista" readonly placeholder="Artists">
                <input type="text"  name="campoAlbum" readonly placeholder="Album">
                <input type="text"  name="campoCancion" readonly placeholder="Songs">
            </div>
        </div>
        <!--que me lo filtre por genero y salgan las canciones por los lados-->
        <div class="intrsumentos" id="intrsumentos">
            <p class="inputText">Genre</p>
            <label><input type="checkbox" name="generomusical" value="Jazz"> Jazz</label>
            <label><input type="checkbox" name="generomusical" value="Pop"> Pop</label>
            <label><input type="checkbox" name="generomusical" value="Indie"> Indie</label>
            <label><input type="checkbox" name="generomusical" value="Rap"> Rap</label>
            <label><input type="checkbox" name="generomusical" value="Electro"> Electro</label>


        </div>
      
    </form>
</body>

</html>
